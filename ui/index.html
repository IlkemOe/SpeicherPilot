<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpeicherPilot</title>
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script>
    window.SP_TOKEN = "__TOKEN__";
    try { const t = localStorage.getItem('sp-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    <div class="grain"></div>
  </div>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="/static/logo.svg" alt="" width="38" height="38">
        <div>
          <div class="brand-name">SpeicherPilot</div>
          <div class="brand-sub">Platz schaffen, ohne Risiko</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-bottom">
        <div class="seg theme-switch" id="themeSwitch"></div>
        <div class="freed-card">
          <div class="freed-label">Aufgeräumt in dieser Sitzung</div>
          <div class="freed-value" id="sessionFreed">0 B</div>
        </div>
        <div class="bin-card" id="binCard"></div>
      </div>
    </aside>

    <main class="main" id="main">
      <section class="view" id="view-overview"></section>
      <section class="view" id="view-junk"></section>
      <section class="view" id="view-unused"></section>
      <section class="view" id="view-large"></section>
      <section class="view" id="view-games"></section>
      <section class="view" id="view-map"></section>
    </main>
  </div>

  <div class="actionbar" id="actionbar"></div>
  <div class="drawer" id="drawer"></div>
  <div class="toasts" id="toasts"></div>
  <div class="modal-wrap" id="modal"></div>
  <div class="tooltip" id="tooltip"></div>
  <div class="fx" id="fx"></div>

  <script src="/static/app.js"></script>
</body>
</html>
